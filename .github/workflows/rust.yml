name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: clippy and test
    # Pure Rust with no platform-specific code, so one runner covers it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # No toolchain action: rustup installs what rust-toolchain.toml names on
      # the first cargo invocation, so the pin stays in one file.
      - name: Cache dependency builds
        uses: Swatinem/rust-cache@v2
      # Default features first: what a local module builds, without the HTTP
      # server or OpenTelemetry.
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Clippy, all features
        run: cargo clippy --locked --all-targets --all-features
      - name: Test, all features
        run: cargo test --locked --all-features

  format:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check

  deny:
    name: cargo deny
    # Its own job: it reads the crate graph's metadata and needs no build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check licences, advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
