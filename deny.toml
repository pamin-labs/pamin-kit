# What the crate graph is allowed to carry. Enforced by `cargo deny check` in
# CI; run it locally the same way after `cargo install cargo-deny`.

[licenses]
# Every licence in the graph, listed rather than globbed, so adding a
# dependency with a new one is a decision somebody makes instead of a thing
# that happens.
allow = [
    "Apache-2.0",
    # `matchit`, axum's router, which also matches resource templates, is
    # MIT AND BSD-3-Clause: it derives from Go's httprouter.
    "BSD-3-Clause",
    "MIT",
    # `borrow-or-share`, under jsonschema in the conformance feature.
    "MIT-0",
    "Unicode-3.0",
    # `foldhash`, hashbrown's default hasher, which jsonschema's
    # `referencing` turns on, in the conformance feature.
    "Zlib",
]

[bans]
multiple-versions = "allow"

[graph]
# Check the optional features too: http, otel and conformance bring crates
# the default build does not.
all-features = true
