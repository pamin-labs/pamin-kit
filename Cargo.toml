[package]
name = "pamin-kit"
description = "The framework every Pamin module is built on: the Module trait, operation registration with entitlements, MCP serving over stdio and Streamable HTTP, and a conformance suite."
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/pamin-labs/pamin-kit"
readme = "README.md"
keywords = ["mcp", "modules", "framework"]
categories = ["network-programming", "development-tools"]
exclude = ["/.agents", "/.claude", "/.github", "/.pamin-labs-dev.toml", "/AGENTS.md", "/CLAUDE.md"]

[features]
# Streamable HTTP for hosted use. Off by default, so a local module builds
# no HTTP server.
http = ["dep:axum", "dep:http", "tokio/net", "rmcp/transport-streamable-http-server"]
# The checks a module runs in CI: `pamin_kit::conformance!`. For a module's
# dev-dependencies only.
conformance = ["dep:insta", "dep:jsonschema"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1"], optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
http = { version = "=1.5.0", optional = true }
insta = { version = "=1.49.0", features = ["json"], optional = true }
jsonschema = { version = "=0.60.2", default-features = false, optional = true }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "time"] }

[profile.dev]
debug = "line-tables-only"

[[bench]]
name = "call"
harness = false
