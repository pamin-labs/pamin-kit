[package]
name = "pamin-kit"
description = "The framework every Pamin module is built on: the Module trait, operation registration with entitlements, MCP serving over stdio and Streamable HTTP, and a conformance suite."
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/pamin-labs/pamin-kit"
readme = "README.md"
keywords = ["mcp", "modules", "framework"]
categories = ["network-programming", "development-tools"]
exclude = ["/.agents", "/.claude", "/.github", "/.pamin-labs-dev.toml", "/AGENTS.md", "/CLAUDE.md"]

[features]
# Streamable HTTP for hosted use. Off by default, so a local module builds
# no HTTP server.
http = ["dep:axum", "dep:http", "tokio/net", "rmcp/transport-streamable-http-server"]
# The checks a module runs in CI: `pamin_kit::conformance!`. For a module's
# dev-dependencies only.
conformance = ["dep:insta", "dep:jsonschema"]

# Joins each request's span to the caller's OpenTelemetry trace. The binary
# installs the exporter and the propagator.
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"], optional = true }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
http = { version = "1.5.0", optional = true }
insta = { version = "1.49.0", features = ["json"], optional = true }
jsonschema = { version = "0.60.2", default-features = false, optional = true }
matchit = "0.8.4"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
percent-encoding = "2.3.2"
# Exact: the kit is the only crate that names rmcp, so an MCP specification
# or SDK upgrade is a deliberate kit release.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[profile.dev]
debug = "line-tables-only"

[[bench]]
name = "call"
harness = false

[[bench]]
name = "concurrent"
harness = false
