[package]
name = "pamin-kit"
description = "The framework every Pamin module is built on: the Module trait, operation registration with entitlements, MCP serving over stdio and Streamable HTTP, and a conformance suite."
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/pamin-labs/pamin-kit"
readme = "README.md"
keywords = ["mcp", "modules", "framework"]
categories = ["network-programming", "development-tools"]
exclude = ["/.agents", "/.claude", "/.github", "/.pamin-labs-dev.toml", "/AGENTS.md", "/CLAUDE.md"]

[dependencies]

[profile.dev]
debug = "line-tables-only"
